[project]
name = "project_flytracker"
version = "0.1.0"
description = "Flight tracker using OpenSky and Nominatim APIs"
authors = [
    {name = "sergejgrigorev2861-sys", email = "sergejgrigorev2861@gmail.com"}
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "psycopg2-binary>=2.9.0"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.11.0"
flake8 = "^7.0.0"
isort = "^5.12.0"

[tool.flake8]
max-line-length = 119
exclude = [".git", "__pycache__", ".venv"]

[tool.isort]
profile = "black"
line_length = 119
