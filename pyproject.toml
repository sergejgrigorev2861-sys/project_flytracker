[project]
name = "project_flytracker"
version = "0.1.0"
description = "Flight tracker using OpenSky and Nominatim APIs"
authors = [
    {name = "sergejgrigorev2861-sys", email = "sergejgrigorev2861@gmail.com"}
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
flake8 = ">=7.3.0"
isort = "^8.0.1"

[tool.flake8]
max-line-length = 119
exclude = [".git", "__pycache__", ".venv"]

[tool.isort]
profile = "black"
line_length = 119
